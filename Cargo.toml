[package]
name = "another-ai-sdk"
version = "0.0.6"
license = "MIT"
edition = "2024"
rust-version = "1.85"
description = "Provider-neutral Rust SDK for streaming chat and tool calling."
repository = "https://github.com/christopher-caldwell/rust_ai_sdk"
readme = "README.md"
keywords = ["ai", "llm", "chat", "streaming", "tools"]
categories = ["api-bindings", "asynchronous"]
exclude = [
    ".understand-anything/**",
    ".github/**",
    "AGENTS.md",
    "audits/**",
    "examples/**",
    "issues*.md",
    "release-plz.toml",
    "Justfile",
    "scripts/**",
    "target/**",
]

[dependencies]
async-stream = { version = "0.3", optional = true }
async-trait = "0.1"
bytes = { version = "1", optional = true }
eventsource-stream = { version = "0.2.3", optional = true }
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockito = "1.7.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["providers-all", "streaming"]
openai = ["dep:reqwest", "reqwest/stream"]
anthropic = ["dep:reqwest", "reqwest/stream"]
gemini = ["dep:reqwest", "reqwest/stream"]
providers-all = ["openai", "anthropic", "gemini"]
streaming = ["dep:eventsource-stream", "reqwest?/stream"]
message-stream = ["dep:async-stream", "dep:bytes"]
